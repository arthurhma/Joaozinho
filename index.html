<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joãozinho é do...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4efe6;
      color: #1c1a17;
    }

    p {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      line-height: 1.4;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }

    .spoiler {
      display: inline-block;
      cursor: pointer;
      border: 0;
      padding: 0.05em 0.2em;
      margin: 0;
      font: inherit;
      color: inherit;
      background: transparent;
      filter: blur(9px);
      user-select: none;
      transition: filter 0.25s ease;
    }

    .spoiler.revealed {
      filter: blur(0);
      cursor: default;
    }
  </style>
</head>
<body>
  <p>
    Joãozinho é do...
    <button type="button" class="spoiler" aria-label="Mostrar nome">Arthur</button>
  </p>

  <script>
    const spoiler = document.querySelector(".spoiler");

    spoiler.addEventListener("click", () => {
      spoiler.classList.add("revealed");
      spoiler.setAttribute("aria-label", "Arthur");
    });
  </script>
</body>
</html>
